# SearXNG tự host cho Ăn Dặm Radar. Chạy:  docker compose -f searxng/docker-compose.yml up -d
# Sau đó đặt SEARXNG_URL=http://localhost:8888 trong file .env và khởi động lại app.
services:
  searxng:
    image: searxng/searxng:latest
    container_name: an-dam-searxng
    ports:
      - "8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
